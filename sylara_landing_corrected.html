<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sylara — Build habits. Earn XP. Become your best self." />
  <title>Sylara — MVP in Development</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F1600D;
      color: #FFFFFF;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      padding: 28px;
    }

    .page {
      width: min(640px, 100%);
      text-align: center;
      transform: translateY(-2vh);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin-bottom: 22px;
    }

    .logo {
      width: clamp(48px, 8vw, 66px);
      height: auto;
      display: block;
    }

    .wordmark {
      font-size: clamp(34px, 7vw, 54px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.045em;
    }

    .tagline {
      font-size: clamp(17px, 3.5vw, 22px);
      line-height: 1.45;
      font-weight: 400;
      max-width: 460px;
      margin: 0 auto;
    }

    .rule {
      width: 50px;
      height: 1px;
      background: rgba(255,255,255,.45);
      margin: 31px auto;
    }

    .status {
      display: inline-block;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 19px;
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .small {
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.5;
      opacity: .82;
    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 20px;
      text-align: center;
      font-size: 12px;
      opacity: .65;
    }
  </style>
</head>
